name: Research catalog checks
on:
  push:
    paths:
      - "scripts/**"
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-validation.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "research/**"
      - "tests/**"
      - ".github/workflows/research-validation.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all tests without downloading protected works
        run: python -m unittest discover -s tests -v
      - name: Verify offline research data
        run: |
          python scripts/build_research_catalog.py --out /tmp/research_catalog.sqlite
          python scripts/validate_research.py --catalog /tmp/research_catalog.sqlite
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('research/verified_policy_transitions.csv')
          with p.open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>=18
          assert all(r['source_url'].startswith('https://') for r in rows)
          assert any(r['effective_admission_year']=='2028' and r['area']=='모의평가' for r in rows)
          print('Verified policy transition rows:',len(rows))
          PY
